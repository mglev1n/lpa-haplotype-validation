name: Build and Push Singularity Image

on:
  # Run only after the Docker image build completes, so the Docker image this
  # workflow converts always exists. Release tags (v*) are included because a
  # tag-triggered Docker run reports the tag name as its branch.
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches: [main, master, 'v*']
  # Allow manual conversion of an existing Docker image tag
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Existing Docker image tag to convert (e.g. 0.3.0, sha-1a2b3c4, latest)"
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mglev1n/lpa-validation
  SINGULARITY_IMAGE: lpa-validation.sif

jobs:
  build-singularity:
    name: Build and Push Singularity Image
    runs-on: ubuntu-latest
    # Only run if the Docker build succeeded, or if triggered manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write   # create GitHub releases for v* tags
      packages: write

    steps:
      - name: Determine source image and tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.docker_tag }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_TAG="$DISPATCH_TAG"
            PUSH_TAGS="$DISPATCH_TAG"
            RELEASE_TAG=""
          else
            SHORT_SHA="${HEAD_SHA::7}"
            # Convert the commit-specific Docker image, not :latest, so a later
            # build cannot change what this run converts
            SOURCE_TAG="sha-${SHORT_SHA}"
            if [[ "$HEAD_BRANCH" =~ ^v[0-9] ]]; then
              # Release: v0.3.0 -> 0.3.0, matching the Docker semver tag
              VERSION="${HEAD_BRANCH#v}"
              PUSH_TAGS="${VERSION} sha-${SHORT_SHA} latest"
              RELEASE_TAG="$HEAD_BRANCH"
            else
              PUSH_TAGS="sha-${SHORT_SHA} latest"
              RELEASE_TAG=""
            fi
          fi
          echo "SOURCE_TAG=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "PUSH_TAGS=${PUSH_TAGS}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Converting docker image tag: ${SOURCE_TAG}"
          echo "Pushing Singularity tags: ${PUSH_TAGS}"

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Singularity image from Docker image
        run: |
          apptainer build ${SINGULARITY_IMAGE} docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.SOURCE_TAG }}

      - name: Login to GHCR with Apptainer
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | apptainer remote login -u ${{ github.actor }} --password-stdin oras://${{ env.REGISTRY }}

      - name: Push Singularity image to GHCR
        run: |
          for tag in ${{ steps.tags.outputs.PUSH_TAGS }}; do
            echo "Pushing ${{ env.IMAGE_NAME }}-singularity:${tag}"
            apptainer push ${SINGULARITY_IMAGE} oras://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-singularity:${tag}
          done

      - name: Upload Singularity image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-image
          path: ${{ env.SINGULARITY_IMAGE }}
          retention-days: 5

      - name: Create Release (if tag)
        uses: softprops/action-gh-release@v1
        if: ${{ steps.tags.outputs.RELEASE_TAG != '' }}
        with:
          tag_name: ${{ steps.tags.outputs.RELEASE_TAG }}
          files: ${{ env.SINGULARITY_IMAGE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
